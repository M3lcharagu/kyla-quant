name: Nightly Backtest

on:
  push:
    branches: [main]
    # Prevent the docs-only bot commit from triggering itself again.
    paths-ignore:
      - docs/STRATEGY_LIBRARY.md
  schedule:
    - cron: "0 19 * * *" # Nairobi 22:00
  workflow_dispatch:

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run strategy factory backtest
        run: python scripts/strategy_factory.py --symbol SOLUSDT --interval 5m --limit 20000

      - name: Commit and push updated strategy library
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "kyla-bot"
          git config user.email "kyla-bot@users.noreply.github.com"
          git add docs/STRATEGY_LIBRARY.md
          if git diff --cached --quiet -- docs/STRATEGY_LIBRARY.md; then
            echo "No strategy library changes to commit."
            exit 0
          fi
          git commit -m "chore: update strategy library"
          git push origin HEAD:main
