name: Nightly Backtest

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run strategy factory backtest
        run: python scripts/strategy_factory.py

      - name: Commit and push nightly artifacts
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "kyla-bot"
          git config user.email "kyla-bot@users.noreply.github.com"
          git add -f docs/STRATEGY_LIBRARY.md
          if [ -d results ]; then
            git add -f results
          fi
          if git diff --cached --quiet; then
            echo "No nightly backtest artifacts changed."
            exit 0
          fi
          git commit -m "chore: update nightly backtest artifacts"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
