name: Weekly KPI Report

on:
  schedule:
    - cron: "0 15 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-kpi-main
  cancel-in-progress: false

jobs:
  weekly-kpi:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export paper journal
        run: python scripts/trade_journal.py export --format json --output journal/paper_trades.json

      - name: Generate weekly KPI report
        run: |
          mkdir -p reports
          python scripts/trade_journal.py report | tee reports/weekly-kpi.txt

      - name: Commit and push KPI and journal artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f journal/paper_trades.json journal/trades.db reports/weekly-kpi.txt
          if git diff --cached --quiet; then
            echo "No KPI or journal artifact changes to commit."
            exit 0
          fi
          git commit -m "chore: update weekly KPI report"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
