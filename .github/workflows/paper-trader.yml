name: Paper Trader

on:
  schedule:
    - cron: "*/15 6-13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trader-main
  cancel-in-progress: false

jobs:
  paper-trader:
    if: ${{ vars.PAPER_TRADING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      PAPER_TRADING_ENABLED: ${{ vars.PAPER_TRADING_ENABLED }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one guarded paper-trading cycle
        run: |
          if [ "${PAPER_TRADING_ENABLED:-false}" != "true" ]; then
            echo "PAPER_TRADING_ENABLED is not true; skipping paper trading."
            exit 0
          fi
          python scripts/paper_trader.py --once
          python scripts/trade_journal.py export --format json --output journal/paper_trades.json

      - name: Commit and push paper-trading artifacts
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "kyla-bot"
          git config user.email "kyla-bot@users.noreply.github.com"
          git add -f journal/paper_trades.json journal/trades.db
          if git diff --cached --quiet; then
            echo "No paper-trading artifact changes to commit."
            exit 0
          fi
          git commit -m "chore: update paper-trading artifacts"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
