name: repo-digest

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  update-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch repository digest
        run: |
          mkdir -p docs
          curl -fsSL --max-time 60 -A 'Mozilla/5.0' https://gitingest.com/M3lcharagu/kyla-quant/llms.txt -o docs/repo-digest.txt || echo "NOTICE: digest fetch failed at $(date -u)" > docs/repo-digest.txt

      - name: Commit and push changes
        run: |
          git config user.name kyla-bot
          git config user.email kyla-bot@users.noreply.github.com
          git add docs/repo-digest.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: update repo digest'
          git push
