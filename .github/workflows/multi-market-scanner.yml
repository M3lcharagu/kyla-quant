name: Multi-market strategy scanner

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/STRATEGY_LIBRARY.md
      - docs/DATA_SOURCES.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m py_compile quant/data.py scripts/strategy_factory.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Run real matrix scanner
        run: python scripts/strategy_factory.py --scan --limit 3000 --output docs/STRATEGY_LIBRARY.md
      - name: Commit generated complete results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/STRATEGY_LIBRARY.md docs/DATA_SOURCES.md
          git diff --cached --quiet || git commit -m 'docs: refresh real scanner results'
          git push
